<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Quant - Alpha Terminal</title>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #181b21;
            --accent: #00E5FF;
            --text-main: #E0E0E0;
            --text-dim: #888888;
            --success: #00C853;
            --danger: #FF3D00;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--bg-panel);
            padding: 20px;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: var(--text-dim);
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        select,
        input,
        button {
            width: 100%;
            padding: 10px;
            background: #252A33;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        button {
            background: var(--accent);
            color: black;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            border: none;
        }

        button:hover {
            opacity: 0.9;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .header-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-panel);
            padding: 15px 25px;
            border-radius: 8px;
            flex: 1;
            border-left: 3px solid var(--accent);
        }

        .stat-val {
            font-size: 24px;
            font-weight: 600;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12px;
        }

        /* Chart Area */
        .chart-container {
            flex: 1;
            background: var(--bg-panel);
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        #tv-chart {
            width: 100%;
            height: 100%;
        }

        /* Status Bar */
        .status-bar {
            height: 30px;
            border-top: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 8px;
            display: inline-block;
        }

        .status-pill {
            background: #252A33;
            /* Dark pill */
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            border: 1px solid #333;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">GEMINI 量化終端</div>

        <div class="control-group">
            <label>策略選擇</label>
            <select id="strategy-select">
                <option value="momentum">動能策略 (標準)</option>
                <option value="arena">⚔️ 多策略競技場</option>
                <option value="lstm">LSTM 預測 (Alpha)</option>
            </select>
        </div>

        <div class="control-group">
            <label>資產代碼</label>
            <input type="text" id="ticker-input" value="AAPL">
        </div>

        <div class="control-group">
            <button id="run-btn">執行回測</button>
        </div>

        <div style="margin-top:auto">
            <div class="stat-label">系統版本</div>
            <div style="font-size: 12px; color: #666">Phase 7.3 (Beta CN)</div>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="header-stats">
            <div class="stat-card">
                <div class="stat-label">總回報率</div>
                <div class="stat-val" id="val-return">--%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">夏普比率</div>
                <div class="stat-val" id="val-sharpe">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">最大回撤</div>
                <div class="stat-val" style="color:var(--danger)" id="val-dd">--%</div>
            </div>
        </div>

        <!-- Phase 5: Market Environment Panel -->
        <div class="header-stats" style="margin-bottom: 20px;">
            <div class="stat-card"
                style="border-left: 3px solid #E91E63; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <div class="stat-label">市場狀態 (AI)</div>
                    <div class="stat-val" id="val-regime">載入中...</div>
                </div>
                <div style="text-align: right;">
                    <div class="stat-label">情緒分數</div>
                    <div class="stat-val" id="val-sentiment">--</div>
                    <div style="font-size: 10px; color: #888;" id="val-sent-desc">--</div>
                </div>
            </div>
        </div>

        <!-- Phase 7: Intrinsic Value & Risk -->
        <div class="header-stats" style="margin-bottom: 20px; display: flex; gap: 20px;">
            <!-- Valuation Panel -->
            <div class="stat-card" style="border-left: 3px solid #00C853; flex: 1;">
                <h4>真實價值 (Alpha)</h4>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                    <div>
                        <div class="stat-label">公允價格</div>
                        <div class="stat-val" id="val-fair">---</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="stat-val" style="font-size: 1.2em;" id="val-upside">---</div>
                        <div class="stat-label" id="val-status">---</div>
                    </div>
                </div>
                <div style="font-size: 0.8em; color: #888; margin-top: 8px;" id="val-models">DCF: --- | Graham: ---
                </div>
            </div>

            <!-- Defcon Panel -->
            <div class="stat-card" style="border-left: 3px solid #FF3D00; flex: 1; display: flex; align-items: center;">
                <div id="defcon-circle"
                    style="width: 60px; height: 60px; border-radius: 50%; border: 4px solid #666; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 20px; font-size: 1.5em; color: #888;">
                    ?</div>
                <div>
                    <div class="stat-label">宏觀風險 (DEFCON)</div>
                    <div class="stat-val" id="defcon-label" style="font-size: 1.2em;">監控中</div>
                    <div style="font-size: 0.9em; color: #888;" id="defcon-desc">等待宏觀數據...</div>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <div id="loading-overlay"
                style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10; justify-content:center; align-items:center; color:white;">
                處理中...</div>
            <div id="tv-chart"></div>
        </div>


        <div class="status-bar">
            <div><span class="indicator"></span> 系統連線正常</div>
            <div class="status-pill">ML: 就緒</div>
        </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="charts.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
